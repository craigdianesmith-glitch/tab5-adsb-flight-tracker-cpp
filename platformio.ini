[env:tab5]
platform = https://github.com/pioarduino/platform-espressif32.git#55.03.312-1
board = esp32-p4-evboard
board_build.mcu = esp32p4
board_build.flash_mode = qio
board_build.partitions = partitions_custom.csv
framework = arduino

upload_speed = 1500000
monitor_speed = 115200

; -O2 rather than the Arduino default -Os: flash is not short (the app uses
; ~7MB of 14MB, most of it the voice clips), and measured on the device it parses a 66KB response in
; 45ms instead of 79ms. Drawing into the PSRAM canvas measured the same either
; way - that is bound by memory, not by the code the compiler emits. Only
; code built here is affected; the precompiled framework (WiFi, TLS, drivers)
; stays at -Os.
build_unflags = -Os
build_flags =
    -O2
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    ; -DRENDER_PROFILE   ; logs how long each screen push takes, per flush

; Pinned to the commits this was built and tested against, so a build made
; later - or by someone else - gets the same drivers rather than whatever
; is on their main branch that day.
lib_deps =
    https://github.com/M5Stack/M5Unified.git#8b63555e7bd9ac71978c55ad868fd1d1d3b2ef3e
    https://github.com/M5Stack/M5GFX.git#b863d50dd3ca57b65c61a468001925fee70b3e05
    bblanchon/ArduinoJson@7.4.3

; The image to publish: `pio run -e release`. The same firmware, without
; include/secrets.h - whatever is in it never reaches a released image, which
; opens the WiFi screen on first boot to be given a network on-screen.
[env:release]
extends = env:tab5
build_flags =
    ${env:tab5.build_flags}
    -DRELEASE_BUILD
